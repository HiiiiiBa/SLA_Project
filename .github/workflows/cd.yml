name: CD - Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest \
            ./frontend


      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest


      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/SLA_Project

            kubectl rollout restart deployment/backend -n sla-monitoring
            kubectl rollout restart deployment/frontend -n sla-monitoring

            kubectl rollout status deployment/backend -n sla-monitoring
            kubectl rollout status deployment/frontend -n sla-monitoring
