name: CD - Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest \
            ./backend


      - name: Build frontend image
        run: |
          # Same-origin: le navigateur appelle /api sur le même host (IP ou domaine)
          docker build \
            --build-arg NEXT_PUBLIC_API_URL= \
            --build-arg NEXT_PUBLIC_WS_URL= \
            -t ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest \
            ./frontend


      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sla-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: .trivyignore


      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
          trivyignores: .trivyignore


      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest


      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/SLA_Project

            # Récupérer le code (manifests k8s, etc.)
            git fetch origin main
            git reset --hard origin/main

            # DevSecOps — TLS (secret openssl si absent)
            if [ -d k8s/security ] && [ -f k8s/security/generate-tls-secret.sh ]; then
              if ! sudo kubectl get secret sla-monitoring-tls -n sla-monitoring >/dev/null 2>&1; then
                chmod +x k8s/security/generate-tls-secret.sh
                sudo -E bash k8s/security/generate-tls-secret.sh
              fi
            fi

            # Appliquer le routage Traefik + monitoring
            if [ -d k8s/traefik ]; then
              sudo kubectl apply -f k8s/traefik/middleware-redirect-https.yaml
              sudo kubectl apply -f k8s/traefik/ingressroute-frontend.yaml
              sudo kubectl apply -f k8s/traefik/ingressroute-backend.yaml
            fi
            if [ -d k8s/monitoring ]; then
              sudo kubectl apply -f k8s/monitoring/prometheus.yaml
              sudo kubectl apply -f k8s/monitoring/loki.yaml
              sudo kubectl apply -f k8s/monitoring/promtail.yaml
              sudo kubectl apply -f k8s/monitoring/grafana.yaml
              sudo kubectl apply -f k8s/monitoring/ingressroute.yaml
              sudo kubectl rollout restart deployment/grafana -n sla-monitoring || true
            fi

            # Tirer les images fraîchement poussées sur Docker Hub
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest
            sudo docker save ${{ secrets.DOCKER_USERNAME }}/sla-backend:latest | sudo k3s ctr images import -
            sudo docker save ${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest | sudo k3s ctr images import -

            # Forcer le redeploy avec les nouvelles images
            sudo kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/sla-backend:latest -n sla-monitoring
            sudo kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/sla-frontend:latest -n sla-monitoring
            sudo kubectl patch deploy frontend -n sla-monitoring -p '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"Always"}]}}}}'
            sudo kubectl patch deploy backend -n sla-monitoring -p '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"Always"}]}}}}'

            sudo kubectl rollout restart deployment/backend -n sla-monitoring
            sudo kubectl rollout restart deployment/frontend -n sla-monitoring

            sudo kubectl rollout status deployment/backend -n sla-monitoring --timeout=180s
            sudo kubectl rollout status deployment/frontend -n sla-monitoring --timeout=180s
