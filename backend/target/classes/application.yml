spring:
  application:
    name: sla-monitoring
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:sla-monitoring-jwt-secret-key-change-in-production-min-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

sla:
  engine:
    enabled: true
    cron: ${SLA_ENGINE_CRON:0 0 * * * *}
    evaluation-period-hours: ${SLA_ENGINE_PERIOD_HOURS:24}
    auto-create-alerts: true
    auto-generate-reports: true
  simulation:
    enabled: true
    cron: ${SLA_SIMULATION_CRON:0 */5 * * * *}
    scenario: ${SLA_SIMULATION_SCENARIO:NORMAL}
    sync-service-status: true

alert:
  notification:
    email-enabled: true
    websocket-enabled: true
    email-also-for-web-alerts: true
    notify-client: true
    notify-admins: true
    from-address: ${ALERT_FROM_ADDRESS:sla-monitoring@sla.com}
    from-name: ${ALERT_FROM_NAME:SLA Monitoring}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    seed-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
