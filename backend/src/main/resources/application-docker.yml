spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sla_monitoring}
    username: ${DB_USERNAME:sla_user}
    password: ${DB_PASSWORD:sla_password}

  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    seed-enabled: ${APP_DEMO_SEED_ENABLED:true}

sla:
  simulation:
    enabled: ${SLA_SIMULATION_ENABLED:true}

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.sla.monitoring: INFO
    org.springframework.web: WARN
