apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: sla-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: sla-monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      # Node-local Loki (hostNetwork) — avoids broken ClusterIP DNS on this node
      - url: http://127.0.0.1:3100/loki/api/v1/push

    scrape_configs:
      # Static file scrape — no Kubernetes API required (avoids ClusterIP API timeout)
      - job_name: sla-pod-logs
        static_configs:
          - targets: [localhost]
            labels:
              job: sla-pods
              __path__: /var/log/pods/sla-monitoring_*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '/var/log/pods/(?P<namespace>[^_/]+)_(?P<pod>[^_/]+)_[^/]+/(?P<container>[^/]+)/'
          - labels:
              namespace:
              pod:
              container:
          - match:
              selector: '{container="backend"}'
              stages:
                - static_labels:
                    app: backend
          - match:
              selector: '{container="frontend"}'
              stages:
                - static_labels:
                    app: frontend
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: sla-monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: http
              containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
