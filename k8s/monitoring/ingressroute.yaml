apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring
  namespace: sla-monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.sla-monitoring.local`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
    - match: Host(`prometheus.sla-monitoring.local`)
      kind: Rule
      services:
        - name: prometheus
          port: 9090
