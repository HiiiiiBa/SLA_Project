# Hosts publics (sslip.io = DNS gratuit vers l'IP OCI) + .local (PC avec hosts)
# URL web : http://sla.84.8.216.210.sslip.io
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
  namespace: sla-monitoring
  labels:
    app: frontend
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`)
      kind: Rule
      services:
        - name: frontend
          port: 3000
          scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-secure
  namespace: sla-monitoring
  labels:
    app: frontend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`)
      kind: Rule
      services:
        - name: frontend
          port: 3000
          scheme: http
  tls:
    secretName: sla-monitoring-tls
---
# Accès direct par IP publique (téléphone / PC sans DNS custom)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-ip
  namespace: sla-monitoring
  labels:
    app: frontend
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`84.8.216.210`) || PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 3000
          scheme: http
