apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api
  namespace: sla-monitoring
  labels:
    app: backend
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sla-monitoring.local`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: Host(`sla-monitoring.local`) && PathPrefix(`/ws`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api-secure
  namespace: sla-monitoring
  labels:
    app: backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sla-monitoring.local`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: Host(`sla-monitoring.local`) && PathPrefix(`/ws`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
