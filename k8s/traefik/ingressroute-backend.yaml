apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api
  namespace: sla-monitoring
  labels:
    app: backend
spec:
  entryPoints:
    - web
  routes:
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`) || Host(`84.8.216.210`)) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`) || Host(`84.8.216.210`)) && PathPrefix(`/ws`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`) || Host(`84.8.216.210`)) && PathPrefix(`/actuator`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    # API aussi via IP sans Host connu (PathPrefix seul, priorité haute)
    - match: PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/actuator`)
      kind: Rule
      priority: 50
      services:
        - name: backend
          port: 8080
          scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: backend-api-secure
  namespace: sla-monitoring
  labels:
    app: backend
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`)) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`)) && PathPrefix(`/ws`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
    - match: (Host(`sla-monitoring.local`) || Host(`sla.84.8.216.210.sslip.io`)) && PathPrefix(`/actuator`)
      kind: Rule
      priority: 100
      services:
        - name: backend
          port: 8080
          scheme: http
  tls:
    secretName: sla-monitoring-tls
