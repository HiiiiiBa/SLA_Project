name: sla-monitoring-prod

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sla_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-sla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sla_password}
    volumes:
      - sla_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sla_user} -d ${POSTGRES_DB:-sla_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 12


  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025"


  backend:
    image: hiiiba698/sla-backend:latest
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod,docker

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sla_monitoring}
      DB_USERNAME: ${POSTGRES_USER:-sla_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sla_password}

      MAIL_HOST: mailhog
      MAIL_PORT: 1025

      JWT_SECRET: ${JWT_SECRET}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-false}
      SLA_SIMULATION_ENABLED: ${SLA_SIMULATION_ENABLED:-false}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}

    ports:
      - "8080:8080"



  frontend:
    image: hiiiba698/sla-frontend:latest
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_started

    environment:
      NODE_ENV: production

    ports:
      - "3000:3000"


volumes:
  sla_postgres_data: