sonar.projectKey=sla-monitoring
sonar.projectName=SLA Monitoring

# Remplacer / surcharger via variables GitHub Actions (SONAR_ORGANIZATION, SONAR_PROJECT_KEY)
sonar.organization=CHANGE_ME
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.spec.ts

sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,\
  **/*.test.ts,**/*.spec.ts,frontend/src/app/**/layout.tsx

sonar.coverage.exclusions=**/dto/**,**/entity/**,**/config/**,**/*Application.java,\
  frontend/src/app/**,frontend/src/components/**

sonar.qualitygate.wait=true
